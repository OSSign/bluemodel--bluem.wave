# Signing workflow for OSSign/bluemodel--bluem.wave (source: bluemodel/BlueM.Wave).
#
# BlueM.Wave is a .NET 10 WinForms application (source/Wave.vbproj) with an
# Inno Setup installer (setup/Wave.Setup.iss). The outputs mirror upstream's
# release.yml: a zip of the x64 build and the x64 setup exe.
#
# Differences from upstream, agreed in the initial review:
#   - MathParserNet.dll is committed to the source as a binary. It is rebuilt
#     here from bluemodel/MathParserNet at a pinned commit and replaces the
#     committed copy before Wave is built.
#   - The TeeChart license (upstream secret TEECHARTLICENSE, embedded into
#     Wave.dll) comes from the signing environment secret TEECHARTLICENSE.
#   - Upstream's third-party actions (secret-file, semver, Inno Setup) are
#     replaced by plain steps.
#
# Signed: Wave.exe and Wave.dll (the project's own code), the setup exe and
# its uninstaller (through Inno Setup's SignTool). Third-party DLLs, including
# the rebuilt MathParserNet.dll, are shipped as they are.
#
#   [DO NOT CHANGE]  the server or the review depends on it; keep it as is
#   [CHANGE ME]     project specific; replace freely
#   [OPTIONAL]  can be removed without affecting the server

name: Sign release

run-name: "Sign ${{ inputs.ref }} [${{ inputs.dispatch_id }}]"      # [DO NOT CHANGE]

on:                                                                 # [DO NOT CHANGE] all four inputs
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repository as requested
        required: true
      sha:
        description: Commit pinned by ossign-server; the build uses this, never the moving ref
        required: true
      release_name:
        description: Name of the GitHub release to publish
        required: true
      dispatch_id:
        description: Dispatch id assigned by ossign-server
        required: true

env:
  # [DO NOT CHANGE] Repository variables. SOURCE_REPO and OSSIGN_SERVER are set
  # automatically during onboarding; add OSSIGN_KEY (the key name on the
  # server) under Settings → Secrets and variables → Actions → Variables.
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  OSSIGN_SERVER: ${{ vars.OSSIGN_SERVER }}
  OSSIGN_KEY: ${{ vars.OSSIGN_KEY }}

# [DO NOT CHANGE] id-token: write gives the job its OIDC token (signing and the report fetch).
# contents: write is only needed by the release step at the bottom.
permissions:
  contents: write
  id-token: write

jobs:
  # The review scans the pinned commit on the server (the ossign-scanner
  # service) before this job's environment is released, so the workflow has
  # no scanning job of its own.

  sign:
    runs-on: windows-2025-vs2026                                 # [CHANGE ME] upstream's runner
    environment: signing                                         # [DO NOT CHANGE]
    defaults:
      run:
        shell: bash
    env:
      # [CHANGE ME] Output folder of `dotnet build --arch x64 -c Release`, as in upstream's release.yml.
      BUILD_DIR: src/source/bin/Release/net10.0-windows/win-x64
      # [CHANGE ME] MathParserNet v2.0.0 (tag v2.0.0). The source at this commit is
      # what the committed DLL was built from (it embeds 08009853, whose library
      # code is identical). Update together with upstream's lib/MathParserNet.
      MATHPARSERNET_REPO: https://github.com/bluemodel/MathParserNet
      MATHPARSERNET_SHA: 70ca6a0d88d2b2519df744af2df94ecf265bcffc
    steps:
      - name: Check out the pinned source commit                 # [DO NOT CHANGE]
        run: |
          git init src
          cd src
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "${{ inputs.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"

      - uses: actions/setup-dotnet@v6                            # [CHANGE ME]
        with:
          dotnet-version: "10.0.x"

      # [DO NOT CHANGE] Install the CLI and write its configuration once. Files are
      # signed by the action steps below and, for the installer, by Inno Setup's SignTool through the CLI. The CLI
      # authenticates with the job's OIDC token, so no secret is involved.
      - name: Install ossign
        id: ossign
        uses: ossign/ossign@3cdaeec0bd39965cf9948bce870e39c142fefc1d
        with:
          installOnly: true
          config: |
            { "tokenType": "ossignServer",
              "ossignServer": { "url": "${{ env.OSSIGN_SERVER }}", "key": "${{ env.OSSIGN_KEY }}",
                                "metadata": { "dispatch": "${{ inputs.dispatch_id }}", "sha": "${{ inputs.sha }}" } },
              "timestampUrl": "http://timestamp.acs.microsoft.com/tsa/advanced",
              "msTimestampUrl": "http://timestamp.acs.microsoft.com/tsa" }

      # [CHANGE ME] Replace the committed MathParserNet.dll with one built from
      # source. Refuse to build if upstream moved to another MathParserNet
      # version, so a version bump cannot silently ship the old code.
      - name: Build MathParserNet from source
        run: |
          git init mathparsernet
          cd mathparsernet
          git remote add origin "$MATHPARSERNET_REPO"
          git fetch --depth 1 origin "$MATHPARSERNET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MATHPARSERNET_SHA"
          dotnet build MathParserNet/MathParserNet.csproj --configuration Release -p:Platform=x64

      - name: Replace the committed MathParserNet.dll
        shell: pwsh
        run: |
          $committed = "src/source/lib/MathParserNet/MathParserNet.dll"
          $built = "mathparsernet/MathParserNet/bin/x64/Release/netstandard2.0/MathParserNet.dll"
          $want = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $committed)).Version
          $have = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $built)).Version
          if ($want -ne $have) {
            throw "Source references MathParserNet ${want}, the pinned source builds ${have}; update MATHPARSERNET_SHA"
          }
          Copy-Item $built $committed -Force
          Write-Host "MathParserNet $have built from $env:MATHPARSERNET_SHA"

      # [CHANGE ME] Upstream writes this file from its own secret; Wave.vbproj
      # embeds it, and without it TeeChart shows an evaluation watermark.
      - name: Write the TeeChart license
        shell: pwsh
        env:
          TEECHART_LICENSE: ${{ secrets.TEECHARTLICENSE }}
        run: |
          if (-not $env:TEECHART_LICENSE) { throw "The TEECHARTLICENSE secret is not set on the signing environment" }
          [IO.File]::WriteAllText("$PWD/src/source/My Project/TeeChart.licenses", $env:TEECHART_LICENSE)

      - name: Build Wave                                         # [CHANGE ME] as upstream's release.yml
        working-directory: src
        run: dotnet build source/Wave.vbproj --arch x64 --configuration Release

      # [CHANGE ME] Release versions come from the tag, as upstream does it;
      # branch builds fall back to the assembly version.
      - name: Determine the version
        shell: pwsh
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ($env:REF -match '^v?(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            $version = $Matches[1]
          } else {
            $v = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "$env:BUILD_DIR/Wave.dll")).Version
            $version = "$($v.Major).$($v.Minor).$($v.Build)"
          }
          Write-Host "Version $version"
          "VERSION=$version" >> $env:GITHUB_ENV

      # [CHANGE ME] Signed in place; the config was written by the install step.
      - name: Sign Wave
        uses: ossign/ossign@3cdaeec0bd39965cf9948bce870e39c142fefc1d
        with:
          installOnly: false
          inputFiles: |
            ${{ env.BUILD_DIR }}/Wave.exe
            ${{ env.BUILD_DIR }}/Wave.dll

      - name: Create zip archive                                 # [CHANGE ME]
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:BUILD_DIR/*" -DestinationPath "dist/BlueM.Wave_${env:VERSION}_x64.zip"

      # [CHANGE ME] Build the installer from the signed files. A wrapper script
      # turns on Inno Setup's SignTool, which signs the uninstaller and the
      # setup exe with the ossign CLI; upstream's script is used unchanged.
      - name: Build and sign the installer
        shell: pwsh
        run: |
          @'
          #include "Wave.Setup.iss"

          [Setup]
          SignTool=ossign
          SignedUninstaller=yes
          '@ | Set-Content -Encoding utf8 src/setup/ossign.iss

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe", "$env:ProgramFiles/Inno Setup */ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) is not installed on the runner" }
          Write-Host "Using $iscc"

          & $iscc '/Sossign=ossign -c ${{ steps.ossign.outputs.configPath }} -t pecoff -o $f $f' "/DMyAppVersion=$env:VERSION" '/DMySourceDir=..\source\bin\Release\net10.0-windows\win-x64' src/setup/ossign.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item "src/setup/BlueM.Wave_${env:VERSION}_x64_setup.exe" dist/

      # [DO NOT CHANGE] Refuse to publish if anything is unsigned, test-mode signed
      # or signed by the wrong certificate.
      - name: Verify signatures
        run: |
          shopt -s nullglob
          files=("$BUILD_DIR/Wave.exe" "$BUILD_DIR/Wave.dll" dist/*.exe)
          test ${#files[@]} -eq 3
          for f in "${files[@]}"; do ossign verify "$f"; done

      # [RECOMMENDED] Fetch the review report bundle so it can be published next
      # to the binaries.
      - name: Fetch the review report
        run: |
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OSSIGN_SERVER" | jq -r .value)
          mkdir -p review
          for f in review-report.json review-report.md review-scans.zip review-report.json.p7s; do
            curl -sS --fail -H "Authorization: Bearer $OIDC" -o "review/$f" \
              "$OSSIGN_SERVER/api/v1/reviews/${{ inputs.dispatch_id }}/report/$f"
          done

      # [OPTIONAL] x64 only, as upstream, so the file names do not collide.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.ref }}-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          body_path: review/review-report.md
          files: |
            dist/*.zip
            dist/*.exe
            review/*
